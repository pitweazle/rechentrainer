<svg xmlns="http://www.w3.org/2000/svg"
version=1.1"center_y3
viewbox="0 0 400 200">
<defs>
  <g id="speiche">
    <line x1="135" y1="100" x2="265" y2="100" stroke="silver" stroke-width="1"/>
  </g>
</defs> 

<style>
  .masze {font: italic 16px sans-serif;}
</style> 

{% if parameter.object == "segment" %}
  {% if parameter.typ == 4 %}
    <rect x="{{parameter.s_ex}}"" y= "{{parameter.s_ey}}" width="{{parameter.Radius}}" height="{{parameter.Radius}}"
    stroke="black" 
    stroke-width="0.5"
    fill="yellow" />
  {% endif %}

    <path d="
    M {{parameter.x0}}, {{parameter.y0}}
    L {{parameter.s_ax}} {{parameter.s_ay}}        
    A {{parameter.Radius}} {{parameter.Radius}} 0 0 0 {{parameter.s_ex}} {{parameter.s_ey}}
    Z "
    stroke="black" 
    stroke-width="0.5"
    {% if parameter.typ == 4 %}
      fill="white"
    {% elif parameter.typ == 5 %}
      fill="yellow"
    {% else %}
      fill="lightskyblue"
    {% endif %}
    />

    {% if parameter.typ == 2 %}
      <path d="
        M {{parameter.s_ax}}, {{parameter.s_ay}} A {{parameter.Radius}} {{parameter.Radius}} 0 0 0 {{parameter.s_ex}} {{parameter.s_ey}}"
        stroke="red" 
        stroke-width="2"
        fill="lightskyblue"
        />  
    {% endif %}

    {% if parameter.typ == 3 or parameter.typ == 6 %}
      <line x1="{{parameter.s_ex}}" y1="{{parameter.s_ey}}" x2="{{parameter.s_ax}}" y2="{{parameter.s_ay}}" stroke="green" stroke-width="2"/>

    {% elif parameter.typ != 3 %}
      <line x1="{{parameter.x0}}" y1="{{parameter.y0}}" x2="{{parameter.s_ax}}" y2="{{parameter.s_ay}}" stroke="green" stroke-width="2"/>

    {% elif parameter.typ < 3 %}
      <path d="
      M {{parameter.w_ax}}, {{parameter.w_ay}} A 30 30 0 0 0 {{parameter.w_ex}} {{parameter.w_ey}}"
      stroke="blue" 
      fill="lightskyblue"
      />
    {% endif %}

    <text x="{{parameter.mx|add:-15}}" y="{{parameter.y0|add:15}}" class = "masze">{{parameter.radius_text}}</text>
    <text x="{{parameter.w_mx|add:-15}}" y="{{parameter.w_my|add:15}}" class = "masze">{{parameter.winkel_text}}</text>

{% elif parameter.object == "kreisring" %}
  <circle cx="{{parameter.x}}" cy="{{parameter.y}}" r="{{parameter.Radius}}"  fill="lightskyblue" stroke = "black"/>
  <circle cx="{{parameter.x}}" cy="{{parameter.y}}" r="{{parameter.radius}}"  fill="white" stroke = "black"/>
  <line x1="{{parameter.x}}" y1="{{parameter.y}}" x2="{{parameter.xo}}" y2="{{parameter.yo}}" stroke="green" stroke-width="2"/>
  <line x1="{{parameter.x}}" y1="{{parameter.y}}" x2="{{parameter.xu}}" y2="{{parameter.yu}}" stroke="red" stroke-width="2"/>
{% elif parameter.object == "restflaeche" %}
  <rect x="{{parameter.x0}}"" y= "{{parameter.y0}}" width="{{parameter.seite}}" height="{{parameter.seite}}" fill="yellow" stroke = "black"/>
  <circle cx="{{parameter.x}}" cy="{{parameter.y}}" r="{{parameter.radius}}"  fill="white" stroke = "black"/>
  <line x1="{{parameter.xd_a}}" y1="{{parameter.y}}" x2="{{parameter.xd_e}}" y2="{{parameter.y}}" stroke="green" stroke-width="2"/>
  <text x="{{parameter.x|add:-15}}" y="{{parameter.y|add:15}}" class = "masze">{{parameter.durchmesser_text}}</text>
  <text x="{{parameter.x|add:-15}}" y="{{parameter.ym|add:15}}" class = "masze">{{parameter.seite_text}}</text>
{% elif parameter.object == "rad" %}
  <circle cx="200" cy="100" r="70"  fill="white" stroke = "grey" stroke-width="10"/>
  {% for n in parameter.winkel %}
    <use href="#speiche" transform="rotate({{n}} 200 100)"/>
  {% endfor%}
  <circle cx="200" cy="100" r="10"  fill="silver" stroke = "grey" stroke-width="1"/>
{% elif parameter.object == "kreis" %}
  {% if parameter.typ == 12 %}
    <circle cx="200" cy="100" r="70"  fill="lightskyblue" stroke = "red" stroke-width="2"/>
    <line x1="130" y1="100" x2="270" y2="100" stroke="blue" stroke-width="1"/>
    <text x="180" y="115" class = "masze">{{parameter.gegeben_text}}</text>
  {% elif parameter.typ == 13 %}
    <circle cx="200" cy="100" r="70"  fill="lightskyblue" stroke = "black"/>
    <line x1="200" y1="100" x2="270" y2="100" stroke="blue" stroke-width="1"/>
    <text x="205" y="115" class = "masze">{{parameter.gegeben_text}}</text>
  {% elif parameter.typ == 14 %}
    <circle cx="200" cy="100" r="70"  fill="lightskyblue" stroke = "red" stroke-width="2"/>
    <line x1="200" y1="100" x2="270" y2="100" stroke="blue" stroke-width="1"/>
    <text x="205" y="115" class = "masze">{{parameter.gegeben_text}}</text>
  {% elif parameter.typ == 15 %}
    <circle cx="200" cy="100" r="70"  fill="lightskyblue" stroke = "black"/>
    <line x1="130" y1="100" x2="270" y2="100" stroke="blue" stroke-width="1"/>
    <text x="180" y="115" class = "masze">{{parameter.gegeben_text}}</text>
  {% endif %}
{%endif %}
 </svg>