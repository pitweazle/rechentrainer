<svg xmlns="http://www.w3.org/2000/svg"
version=1.1"center_y3
viewbox="0 0 400 200">
<defs>
</defs> 

<style>
</style> 
{% if parameter.object == "segment" %}
  <path d="
  M {{parameter.x0}}, {{parameter.y0}}
  L {{parameter.s_ax}} {{parameter.s_ay}}        
  A {{parameter.Radius}} {{parameter.Radius}} 0 0 0 {{parameter.s_ex}} {{parameter.s_ey}}
  Z "
  stroke="black" 
  stroke-width="0.5"
  fill="lightskyblue"
  />

  <path d="
  M {{parameter.w_ax}}, {{parameter.w_ay}} A 30 30 0 0 0 {{parameter.w_ex}} {{parameter.w_ey}}"
  stroke="blue" 
  stroke="lightskyblue"
  fill="lightskyblue"
  />

  <line x1="{{parameter.x0}}" y1="{{parameter.y0}}" x2="{{parameter.s_ax}}" y2="{{parameter.s_ay}}" stroke="red"/>


{%endif%}
 </svg>