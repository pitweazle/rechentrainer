<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Physiktrainer{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles_physik.css' %}">
    {% block css_files %}{% endblock %}
</head>

<body>

    <header>
        <nav class="navbar main">
            <a href="javascript:history.back()" class="btn-back">⬅ Zurück</a>
            <a href="{% url 'physik:index' %}" class="btn-back">🏠 Startseite</a>
            {% if user.is_authenticated %}
                <span>Eingeloggt als: <strong>{{ user.username }}</strong></span> 
                <a href="/physik/logout/" >Abmelden</a>
            {% else %}
                <a href="/physik/login/" >Anmelden</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
