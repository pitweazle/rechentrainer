<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Physiktrainer{% endblock %}</title>
    {% load static %}
    {% block css_files %}{% endblock %}
</head>

<body>
    <nav style="background: #eee; padding: 10px; margin-bottom: 20px;">
        <a href="javascript:history.back()" class="btn-back">⬅ Zurück</a>
        <a href="{% url 'physik:index' %}" class="btn-back">🏠 Startseite</a>
        
        {% if user.is_authenticated %}
            <span>Eingeloggt als: <strong>{{ user.username }}</strong></span> | 
            
            <form action="{% url 'logout' %}?next={% url 'physik:index' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" style="background: none; border: none; color: red; cursor: pointer; padding: 0; font-family: inherit; font-size: inherit; text-decoration: underline;">
                    Abmelden
                </button>
            </form>
        {% else %}
            <a href="{% url 'login' %}?next={% url 'physik:index' %}" style="color: green;">Anmelden</a>
        {% endif %}
    </nav>

    <header>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
